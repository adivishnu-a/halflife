[project]
name = "halflife-ml"
version = "0.1.0"
description = "Training pipeline for the Halflife scheduler: data, baselines, half-life regression, evaluation, export."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "pyyaml>=6",
    "requests>=2.32",
    "matplotlib>=3.9",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
